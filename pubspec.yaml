name: app_tienda
description: "App Tienda: tienda en línea con roles, 2FA, notificaciones, mapa y pagos simulados."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de datos local
  sqflite: ^2.4.4+1
  path: ^1.9.1

  # Red, preferencias y correo
  http: ^1.2.2
  shared_preferences: ^2.5.3
  mailer: ^6.4.1

  # Compartir, biometría, mapa y ubicación
  share_plus: ^13.0.0
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Login social, imágenes y utilidades
  google_sign_in: ^6.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  provider: ^6.1.2

  # Seguridad
  crypto: ^3.0.6
  encrypt: ^5.0.3
  # Usa la 11: la 9 choca con win32 que trae share_plus 13
  flutter_secure_storage: ^11.0.0

  # Notificaciones y enlaces externos
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  xml: ^6.6.1

# Windows con espacios en la ruta del proyecto/usuario: estas versiones
# evitan el error de compilación de path_provider.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
